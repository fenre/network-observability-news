# Global pipeline + site settings. All knobs the pipeline and build read live
# here so behaviour can change without touching code.

site:
  title: "Network Observability News"
  description: >-
    Product and platform updates for Splunk and Cisco partners: releases,
    new features, release notes, and practical how-tos — not cyber-incident
    headlines or politics. Each entry links to the original source with an
    original summary — never the full article text.
  # GitHub Pages project-site base URL (no trailing slash). Used for absolute
  # URLs in feed.json, rss.xml, sitemap.xml, llms.txt, manifest.json.
  base_url: "https://fenre.github.io/network-observability-news"
  repository: "https://github.com/fenre/network-observability-news"
  contact: "https://github.com/fenre/network-observability-news/issues"
  maintainer: "fenre (community maintainer)"
  language: "en"

fetch:
  # Identifiable User-Agent with a contact URL (legal/polite requirement).
  user_agent: "network-observability-news/0.1 (+https://github.com/fenre/network-observability-news; aggregator bot; contact: https://github.com/fenre/network-observability-news/issues)"
  contact: "https://github.com/fenre/network-observability-news/issues"
  request_timeout_seconds: 20
  # Polite delay (seconds) between full-text fetches to the same host.
  polite_delay_seconds: 2.0
  # Cap each source per run (30+ feeds); pairs with retention.max_items_per_day.
  max_items_per_feed: 20

enrich:
  # Provider-agnostic: the client talks the OpenAI Chat Completions wire format
  # and honours a custom base_url, so it works with OpenAI, Azure-compatible
  # gateways, OpenRouter, Together, Groq, local llama.cpp servers, etc.
  api_key_env: "LLM_API_KEY"
  model_env: "LLM_MODEL"
  base_url_env: "LLM_BASE_URL"     # optional; default = OpenAI public endpoint
  default_model: "gpt-4o-mini"     # small/cheap default; override via LLM_MODEL
  # Cost guard: never enrich more than this many NEW items per pipeline run.
  max_new_items_per_run: 40
  summary_sentences: 3
  request_timeout_seconds: 40

retention:
  # Rolling window for the full published surfaces. Items older than this many
  # days are pruned from data/items.json (history stays in git).
  days: 90
  # Max non-release items per UTC calendar day. Product releases are EXTRA
  # (they do not consume these slots — a day with 2 releases + cap 12 keeps 14).
  max_items_per_day: 12
  # How to pick survivors when a day has too many items:
  #   importance — technical score + trusted-source reserve (recommended)
  #   published_at — newest timestamps only (legacy behaviour)
  daily_cap_method: importance
  # Slots per day reserved for trusted engineering RSS (Cisco, ntop, OTel, …).
  priority_reserved_slots: 6
  # Splunk/Cisco product-release feeds get reserved cap slots.
  priority_source_ids:
    - gnews-splunk-blog
    - gnews-splunk-platform
    - gnews-splunk-features
    - gnews-splunk-dev
    - gnews-cisco-agenticops
  # Product releases (Splunk / Cisco) always pass relevance + daily cap.
  must_keep:
    enabled: true
    # Extra regexes on title+summary (Python re syntax); defaults cover Splunk/Cisco GA.
    patterns: []
  # Hard cap regardless of age (keeps Pages small). ~90d × 12/day upper bound.
  max_items: 1200

classification:
  # Topic assigned when no keyword and no source hint matches.
  default_topic: "network-observability"

# Partner briefing editorial line (see newsfeed/editorial.py).
editorial:
  # product_updates — releases, features, how-tos; drop incident/politics noise
  focus: product_updates
  drop_incidents: true
  drop_politics: true
  # Default category filter on the web UI (empty = show all).
  default_categories:
    - product-release
    - tutorial
  curated_enabled: true
  highlights_enabled: true
  highlights_limit: 10

# Technical-audience gate (see newsfeed/relevance.py). Drops finance/PR/stub
# items that only mention a brand in passing. Engineering blogs are trusted;
# Google News requires stronger technical signals in title/summary.
relevance:
  enabled: true
  min_score_googlenews: 2
  min_score_gnews_trusted_publisher: 1
  min_score_default: 1

build:
  # How many recent items to inline in llms-full.txt.
  recent_items_for_llms_full: 120
  # How many recent items to include in rss.xml / feed.json.
  feed_items: 80
