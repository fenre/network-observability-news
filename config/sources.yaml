    feed: "https://news.google.com/rss/search?q=%22Cisco+Data+Fabric%22&hl=en-US&gl=US&ceid=US:en"
    type: googlenews
    topics: [cisco-data-fabric]
    fulltext: deny
    license: null
    enabled: true

  # ---- Network Observability — vendor blogs -------------------------------
