    name: "Cisco Networking Blog"
    homepage: "https://blogs.cisco.com/networking"
    feed: "https://blogs.cisco.com/networking/feed"
    type: rss
    topics: [cisco-data-fabric, network-observability]
    fulltext: deny
    license: null
    enabled: true

  - id: cisco-datacenter-blog
    name: "Cisco Data Center Blog"
    homepage: "https://blogs.cisco.com/datacenter"
    feed: "https://blogs.cisco.com/datacenter/feed"
    type: rss
    topics: [cisco-data-fabric]
    fulltext: deny
    license: null
